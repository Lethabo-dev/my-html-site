
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline Notes</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <header>
        <h1>My Offline Notes</h1>
        <p>Save and load notes using localStorage</p>
    </header>

    <main>
        <h2>Write a Note</h2>

        <textarea id="note" rows="4" cols="40"
            placeholder="Type a note..."></textarea>
        <br><br>

        <button id="saveBtn">Save locally</button>
        <button id="loadBtn">Load saved note</button>

        <p id="status"></p>

        <h2>Internet Connection Status</h2>

<p id="onlineStatus"></p>

<script>
    function updateStatus() {
        document.getElementById('onlineStatus').textContent =
            navigator.onLine
                ? 'Online — data can sync'
                : 'Offline — using local data only';
    }

    window.addEventListener('online', updateStatus);
    window.addEventListener('offline', updateStatus);

    updateStatus();
</script>
    </main>

    <footer>
        <p>© 2026 Lethabo Magopa. All rights reserved.</p>
    </footer>

    <script>
    // Save note locally first, then send it to MongoDB
    document.getElementById('saveBtn').onclick = async () => {
        const noteContent = document.getElementById('note').value;

        if (!noteContent.trim()) {
            document.getElementById('status').textContent =
                'Please write a note first.';
            return;
        }

        // Save immediately in localStorage
        localStorage.setItem('offlineNote', noteContent);

        document.getElementById('status').textContent =
            'Saved locally. Syncing to database...';

        // Send note to the backend
        try {
            const response = await fetch('/api/notes', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    content: noteContent
                })
            });

            if (!response.ok) {
                throw new Error('Database save failed');
            }

            document.getElementById('status').textContent =
                'Saved locally and to MongoDB!';
        } catch (error) {
            document.getElementById('status').textContent =
                'Saved locally. Database sync failed.';
        }
    };

    // Load saved note from localStorage
    document.getElementById('loadBtn').onclick = () => {
        document.getElementById('note').value =
            localStorage.getItem('offlineNote') || '';

        document.getElementById('status').textContent =
            'Loaded from localStorage';
    };
</script>

</body>
</html>
